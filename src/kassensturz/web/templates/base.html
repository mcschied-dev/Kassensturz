<!doctype html>
<html lang="de" class="h-full bg-zinc-950">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}kassensturz{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    body { font-family: 'Work Sans', system-ui, sans-serif; }
    .tnum { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body class="h-full">
<div class="flex min-h-full">
  <aside class="hidden w-56 shrink-0 border-r border-white/10 bg-zinc-900 lg:flex lg:flex-col">
    <div class="flex h-14 items-center gap-2 px-5 border-b border-white/10">
      <span class="inline-block h-2.5 w-2.5 rounded-full bg-white"></span>
      <span class="text-sm font-semibold tracking-tight text-white">kassensturz</span>
    </div>
    <nav class="flex flex-1 flex-col gap-0.5 p-3 text-sm">
      {% for pfad, key, label in [('/', 'dashboard', 'Dashboard'),
                                   ('/buchungen', 'buchungen', 'Buchungen'),
                                   ('/analyse', 'analyse', 'Analyse'),
                                   ('/vertraege', 'vertraege', 'Verträge & Abos')] %}
      <a href="{{ pfad }}"
         class="rounded-lg px-3 py-2 font-medium {{ 'bg-white/10 text-white' if aktiv == key else 'text-zinc-400 hover:bg-white/5 hover:text-white' }}">
        {{ label }}</a>
      {% endfor %}
      <a href="/export/xlsx"
         class="rounded-lg px-3 py-2 font-medium text-zinc-400 hover:bg-white/5 hover:text-white">Excel exportieren</a>
      <a href="/einstellungen/kategorien"
         class="rounded-lg px-3 py-2 font-medium {{ 'bg-white/10 text-white' if aktiv == 'einstellungen' else 'text-zinc-400 hover:bg-white/5 hover:text-white' }}">Einstellungen</a>
    </nav>
    <form method="post" action="/logout" class="p-3 border-t border-white/10">
      <button class="w-full rounded-lg px-3 py-2 text-left text-sm font-medium text-zinc-400 hover:bg-white/5 hover:text-white">Abmelden</button>
    </form>
  </aside>
  <main class="flex-1 min-w-0">
    <div class="mx-auto max-w-6xl p-6 lg:p-10">
      {% block content %}{% endblock %}
    </div>
  </main>
</div>
</body>
</html>
