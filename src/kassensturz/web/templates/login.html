<!doctype html>
<html lang="de" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anmelden — kassensturz</title>
  <script src="/static/tailwind.js"></script>
  <style>
    :root { color-scheme: dark; }
    * { border-radius: 0 !important; }
    html { background: #0a0a0a; }
    body { font-family: 'Work Sans', system-ui, sans-serif; color: #f2f2f2;
           -webkit-font-smoothing: antialiased; }
  </style>
</head>
<body class="flex min-h-full items-center justify-center p-6">
  <form method="post" action="/login"
        class="w-full max-w-sm border border-[#232323] p-8">
    <h1 class="text-xs font-semibold text-white" style="letter-spacing:.22em">KASSENSTURZ</h1>
    <label class="mt-8 block text-[10.5px] font-medium uppercase text-[#565656]"
           style="letter-spacing:.1em" for="password">Passwort</label>
    <input id="password" name="password" type="password" autofocus required
           class="mt-2 block w-full border border-[#232323] bg-[#101010] px-3 py-2 text-sm text-white focus:border-[#3a3a3a] focus:outline-none focus:ring-1 focus:ring-white/40">
    {% if fehler %}<p class="mt-2 text-sm text-[#f87171]">{{ fehler }}</p>{% endif %}
    <button class="mt-6 w-full bg-white px-3 py-2 text-sm font-semibold text-black hover:bg-zinc-200 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white">
      Anmelden</button>
    <p class="mt-4 text-xs text-[#565656]">Lokale Daten. Kein Konto, ein Passwort — gesetzt per <code>kassensturz web-password</code>.</p>
  </form>
</body>
</html>
