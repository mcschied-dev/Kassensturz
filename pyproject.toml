[project]
name = "kassensturz"
version = "0.1.0"
description = "Local-first personal finance reporting for German banks — FinTS/HBCI sync, capital-flow categorization, LaTeX reports"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Marc Schieder" }]
keywords = ["fints", "hbci", "banking", "dkb", "sparkasse", "finance", "reporting"]
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "rich>=13",
    "fints>=5.0.0",
    "keyring>=25.7.0",
    "dkb-robo",
    "jinja2>=3.1.6",
    "requests>=2.34.2",
    "cryptography>=49.0.0",
    "pytr>=0.4.9",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
traderepublic = ["pytr>=0.4"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
kassensturz = "kassensturz.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kassensturz"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
# curl_cffi branch (Friendly-Captcha fix), auf Commit gepinnt (Supply-Chain)
dkb-robo = { git = "https://github.com/grindsa/dkb-robo", rev = "5f8a46967d86dd6103424d96fa7de5840b20d86f" }
