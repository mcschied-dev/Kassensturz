[project]
name = "kassensturz"
version = "0.1.0"
description = "Local-first personal finance reporting for German banks — FinTS/HBCI sync, capital-flow categorization, LaTeX reports"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Marc Schieder" }]
keywords = ["fints", "hbci", "banking", "dkb", "sparkasse", "finance", "reporting"]
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "rich>=13",
]

[project.optional-dependencies]
fints = ["fints>=4.0"]
traderepublic = ["pytr>=0.4"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
kassensturz = "kassensturz.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kassensturz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
